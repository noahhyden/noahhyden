<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Noah Hyden avatar — Gothic quatrefoil tracery">
  <!-- ground -->
  <rect width="512" height="512" fill="#E5E4DB"/>

  <!-- medallion frame -->
  <g fill="none" stroke="#3B5669">
    <circle cx="256" cy="256" r="240" stroke-width="2"/>
    <circle cx="256" cy="256" r="230" stroke-width="6"/>
  </g>

  <!-- quatrefoil tracery -->
  <g fill="none" stroke="#3B5B47" stroke-width="5" stroke-linejoin="round">
    <!-- four overlapping foils -->
    <circle cx="256" cy="161" r="95"/>
    <circle cx="351" cy="256" r="95"/>
    <circle cx="256" cy="351" r="95"/>
    <circle cx="161" cy="256" r="95"/>
    <!-- inscribed square, vertices on the foil centers -->
    <rect x="188.8" y="188.8" width="134.4" height="134.4" transform="rotate(45 256 256)"/>
    <!-- center ring -->
    <circle cx="256" cy="256" r="24"/>
  </g>

  <!-- faluröd center -->
  <circle cx="256" cy="256" r="10" fill="#801818"/>
</svg>
